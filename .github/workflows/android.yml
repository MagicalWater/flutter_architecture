name: Android

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      execution_mode:
        description: CI execution mode for this run
        required: true
        default: repository-default
        type: choice
        options: [repository-default, manual-local, self-hosted, github-hosted]
      artifact_transport:
        description: GitHub artifact transport for this manual run
        required: true
        default: repository-default
        type: choice
        options: [repository-default, none, failure-only, full]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  classify-changes:
    name: Classify Changes
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
        (github.event_name == 'workflow_dispatch' &&
         ((inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
          contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode)))
      }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
      android_build: ${{ steps.classify.outputs.android_build }}
      ios_build: ${{ steps.classify.outputs.ios_build }}
      release_full: ${{ steps.classify.outputs.release_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify repository changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ! python3 tools/ci/validation_planner.py \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"; then
            echo "requires_flutter=true" >> "$GITHUB_OUTPUT"
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "android_build=true" >> "$GITHUB_OUTPUT"
            echo "ios_build=true" >> "$GITHUB_OUTPUT"
            echo "release_full=false" >> "$GITHUB_OUTPUT"
            echo "reason=validation planner execution failure; fail-safe full matrix" >> "$GITHUB_OUTPUT"
          fi

  android-development-debug-apk:
    name: Development Debug APK
    needs: classify-changes
    if: >-
      needs.classify-changes.result == 'success' &&
      needs.classify-changes.outputs.android_build == 'true'
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Build Android development Debug APK
        if: runner.environment == 'github-hosted'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/android-development-artifact
        run: bash tools/ci/build_android_development.sh

      - name: Build managed self-hosted Android development Debug APK
        if: runner.environment == 'self-hosted'
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: android-development-debug
          CI_ARTIFACT_ENVIRONMENT: development
          CI_ARTIFACT_BUILD_MODE: debug
          CI_ARTIFACT_KIND: android-apk
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command android android bash tools/ci/build_android_development.sh

      - name: Preflight Android development full artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport full
          --path "$RUNNER_TEMP/android-development-artifact"

      - name: GitHub storage warning for full Android development artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload Android development verification artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-development-debug-${{ github.sha }}
          path: ${{ runner.temp }}/android-development-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android-release-apk:
    name: Release APK
    needs: classify-changes
    if: >-
      needs.classify-changes.result == 'success' &&
      needs.classify-changes.outputs.android_build == 'true'
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Resolve dependencies
        if: runner.environment == 'github-hosted'
        run: dart pub get

      - name: Verify generated files
        if: runner.environment == 'github-hosted'
        run: bash tools/ci/verify_generated.sh

      - name: Build Android release APK
        if: runner.environment == 'github-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/android-production-artifact
        run: bash tools/ci/build_android_production.sh

      - name: Build managed self-hosted Android release APK
        if: runner.environment == 'self-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: android-production-release
          CI_ARTIFACT_ENVIRONMENT: production
          CI_ARTIFACT_BUILD_MODE: release
          CI_ARTIFACT_KIND: android-apk
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command android android bash -lc '
            dart pub get && bash tools/ci/verify_generated.sh && bash tools/ci/build_android_production.sh
          '

      - name: Preflight Android production full artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport full
          --path "$RUNNER_TEMP/android-production-artifact"

      - name: GitHub storage warning for full Android production artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload Android verification artifact
        if: >-
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-production-release-${{ github.sha }}
          path: ${{ runner.temp }}/android-production-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android-summary:
    name: Android Summary
    needs: [classify-changes, android-development-debug-apk, android-release-apk]
    if: >-
      always() &&
      needs.classify-changes.result != 'skipped'
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    env:
      CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
      ANDROID_BUILD: ${{ needs.classify-changes.outputs.android_build }}
      REASON: ${{ needs.classify-changes.outputs.reason }}
      DEVELOPMENT_RESULT: ${{ needs.android-development-debug-apk.result }}
      RELEASE_RESULT: ${{ needs.android-release-apk.result }}
    steps:
      - name: Checkout repository for managed aggregation
        if: runner.environment == 'self-hosted' && env.ANDROID_BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate managed Android run
        if: runner.environment == 'self-hosted' && env.ANDROID_BUILD == 'true'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/run_local_ci.sh aggregate-managed-run

      - name: Verify Android workflow result
        shell: bash
        run: |
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Android change classification did not complete successfully."
            exit 1
          fi

          if [[ "$ANDROID_BUILD" != "true" ]]; then
            if [[ "$DEVELOPMENT_RESULT" != "skipped" || "$RELEASE_RESULT" != "skipped" ]]; then
              echo "Android builds were not requested but a build job did not skip."
              exit 1
            fi
            echo "Android builds skipped: $REASON"
            exit 0
          fi

          if [[ "$DEVELOPMENT_RESULT" != "success" || "$RELEASE_RESULT" != "success" ]]; then
            echo "Requested Android build failed: development=$DEVELOPMENT_RESULT release=$RELEASE_RESULT"
            exit 1
          fi

          echo "Android development and production verification builds succeeded."
