name: Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-release-apk:
    name: Release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            apps/flutter_architecture/android/**/*.gradle*
            apps/flutter_architecture/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Restore Pub cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.versions.outputs.flutter_version }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ steps.versions.outputs.flutter_version }}-

      - name: Resolve dependencies
        run: dart pub get

      - name: Verify generated files
        run: bash tools/ci/verify_generated.sh

      - name: Build Android release APK
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/android-artifact
        run: bash tools/ci/build_android_release.sh

      - name: Upload Android verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-architecture-android-release-${{ github.sha }}
          path: ${{ runner.temp }}/android-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
