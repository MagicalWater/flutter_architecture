name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation intent for this manual run
        required: true
        default: focused
        type: choice
        options:
          - focused
          - full
          - android
          - ios
          - release
      execution_mode:
        description: CI execution mode for this run
        required: true
        default: repository-default
        type: choice
        options:
          - repository-default
          - manual-local
          - self-hosted
          - github-hosted
      artifact_transport:
        description: GitHub artifact transport for this manual run
        required: true
        default: repository-default
        type: choice
        options:
          - repository-default
          - none
          - failure-only
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify Changes
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
        (github.event_name == 'workflow_dispatch' &&
         ((inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
          contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode)))
      }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    outputs:
      plan_b64: ${{ steps.classify.outputs.plan_b64 }}
      validation_level: ${{ steps.classify.outputs.validation_level }}
      requires_flutter: ${{ steps.classify.outputs.requires_flutter }}
      has_flutter_tests: ${{ steps.classify.outputs.has_flutter_tests }}
      docs_check: ${{ steps.classify.outputs.docs_check }}
      generated_check: ${{ steps.classify.outputs.generated_check }}
      android_build: ${{ steps.classify.outputs.android_build }}
      ios_build: ${{ steps.classify.outputs.ios_build }}
      release_full: ${{ steps.classify.outputs.release_full }}
      fail_safe: ${{ steps.classify.outputs.fail_safe }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify repository changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode || 'focused' }}
        run: |
          if ! python3 tools/ci/validation_planner.py \
            --event "$EVENT_NAME" \
            --mode "$VALIDATION_MODE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"; then
            echo "plan_b64=" >> "$GITHUB_OUTPUT"
            echo "validation_level=full" >> "$GITHUB_OUTPUT"
            echo "requires_flutter=true" >> "$GITHUB_OUTPUT"
            echo "has_flutter_tests=true" >> "$GITHUB_OUTPUT"
            echo "docs_check=true" >> "$GITHUB_OUTPUT"
            echo "generated_check=true" >> "$GITHUB_OUTPUT"
            echo "android_build=true" >> "$GITHUB_OUTPUT"
            echo "ios_build=true" >> "$GITHUB_OUTPUT"
            echo "release_full=false" >> "$GITHUB_OUTPUT"
            echo "fail_safe=true" >> "$GITHUB_OUTPUT"
            echo "reason=validation planner execution failed; fail-safe full matrix" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.requires_flutter == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.requires_flutter == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.requires_flutter == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted quality
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-quality
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: |
          # The managed wrapper appends Local-only evidence; not downloadable from GitHub. to $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash -lc '
            if [[ "${{ needs.classify-changes.outputs.requires_flutter }}" == "true" ]]; then dart pub get; fi &&
            python3 tools/ci/validation_runner.py --phase quality --plan-b64 "$PLAN_B64"
          '

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.requires_flutter == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Run planned quality validation
        if: runner.environment == 'github-hosted'
        env:
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: python3 tools/ci/validation_runner.py --phase quality --plan-b64 "$PLAN_B64"

  generated-consistency:
    name: Generated Consistency
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        if: needs.classify-changes.outputs.generated_check == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.generated_check == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.generated_check == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.generated_check == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted generated consistency
        if: needs.classify-changes.outputs.generated_check == 'true' && runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-generated-consistency
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash -lc '
            dart pub get && python3 tools/ci/validation_runner.py --phase generated --plan-b64 "$PLAN_B64"
          '

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.generated_check == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Verify generated files
        if: needs.classify-changes.outputs.generated_check == 'true' && runner.environment == 'github-hosted'
        env:
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: python3 tools/ci/validation_runner.py --phase generated --plan-b64 "$PLAN_B64"

      - name: Skip generated consistency
        if: needs.classify-changes.outputs.generated_check != 'true'
        run: |
          echo "Generated consistency skipped: ${{ needs.classify-changes.outputs.reason }}"

  tests:
    name: Tests
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        if: needs.classify-changes.outputs.has_flutter_tests == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.has_flutter_tests == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.has_flutter_tests == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.has_flutter_tests == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted Flutter tests
        if: needs.classify-changes.outputs.has_flutter_tests == 'true' && runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-tests
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash -lc '
            dart pub get && python3 tools/ci/validation_runner.py --phase tests --plan-b64 "$PLAN_B64"
          '

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.has_flutter_tests == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Run planned Flutter tests
        if: needs.classify-changes.outputs.has_flutter_tests == 'true' && runner.environment == 'github-hosted'
        env:
          PLAN_B64: ${{ needs.classify-changes.outputs.plan_b64 }}
        run: python3 tools/ci/validation_runner.py --phase tests --plan-b64 "$PLAN_B64"

      - name: Skip Flutter tests
        if: needs.classify-changes.outputs.has_flutter_tests != 'true'
        run: |
          echo "Flutter tests skipped: ${{ needs.classify-changes.outputs.reason }}"

      - name: Preflight golden test failure evidence
        if: >-
          needs.classify-changes.outputs.has_flutter_tests == 'true' &&
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          contains(fromJSON('["failure-only","full"]'), inputs.artifact_transport)
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport "${{ inputs.artifact_transport }}"
          --path packages/design_system/test/failures/

      - name: GitHub storage warning for full golden evidence
        if: >-
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload golden test failure evidence
        if: >-
          needs.classify-changes.outputs.has_flutter_tests == 'true' &&
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          contains(fromJSON('["failure-only","full"]'), inputs.artifact_transport)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-test-failures-${{ github.sha }}
          path: packages/design_system/test/failures/
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_transport == 'full' && 1 || 7 }}

  artifact-summary:
    name: Artifact Summary
    needs: [classify-changes, quality, generated-consistency, tests]
    if: >-
      always() &&
      needs.classify-changes.result == 'success' &&
      ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.execution_mode == 'self-hosted' ||
         (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted'))))
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate managed CI run
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/run_local_ci.sh aggregate-managed-run
