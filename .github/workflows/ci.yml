name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      execution_mode:
        description: CI execution mode for this run
        required: true
        default: repository-default
        type: choice
        options:
          - repository-default
          - manual-local
          - self-hosted
          - github-hosted
      artifact_transport:
        description: GitHub artifact transport for this manual run
        required: true
        default: repository-default
        type: choice
        options:
          - repository-default
          - none
          - failure-only
          - full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: Classify Changes
    if: >-
      ${{
        (github.event_name == 'pull_request' && vars.CI_EXECUTION_MODE == 'github-hosted') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
        (github.event_name == 'workflow_dispatch' &&
         ((inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
          contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode)))
      }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
      android_build: ${{ steps.classify.outputs.android_build }}
      ios_build: ${{ steps.classify.outputs.ios_build }}
      release_full: ${{ steps.classify.outputs.release_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify repository changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! python3 tools/ci/change_classifier.py \
            --event "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
            echo "android_build=true" >> "$GITHUB_OUTPUT"
            echo "ios_build=true" >> "$GITHUB_OUTPUT"
            echo "release_full=false" >> "$GITHUB_OUTPUT"
            echo "reason=classifier execution failed; fail-safe full matrix" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.full_ci == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted quality
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-quality
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          # The managed wrapper appends Local-only evidence; not downloadable from GitHub. to $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash -lc '
            dart pub get &&
            python3 tools/docs/check_docs.py . &&
            python3 -m unittest \
              tools.ci.test_environment_contract \
              tools.ci.test_environment_workflow_matrix_contract \
              tools.ci.test_change_classifier \
              tools.ci.test_drift_schema_governance \
              tools.ci.test_no_sqflite_authority \
              tools.ci.test_ios_workflow_contract \
              tools.ci.test_local_build_commands \
              tools.ci.test_ci_execution_mode_contract \
              tools.ci.test_artifact_workflow_contract \
              tools.ci.test_shell_portability_contract &&
            dart run melos run analyze &&
            git diff --check
          '

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Check documentation
        if: runner.environment == 'github-hosted' || needs.classify-changes.outputs.full_ci != 'true'
        run: python3 tools/docs/check_docs.py .

      - name: Check CI workflow contracts
        if: runner.environment == 'github-hosted' || needs.classify-changes.outputs.full_ci != 'true'
        run: >-
          python3 -m unittest
          tools.ci.test_environment_contract
          tools.ci.test_environment_workflow_matrix_contract
          tools.ci.test_change_classifier
          tools.ci.test_drift_schema_governance
          tools.ci.test_no_sqflite_authority
          tools.ci.test_ios_workflow_contract
          tools.ci.test_local_build_commands
          tools.ci.test_ci_execution_mode_contract
          tools.ci.test_artifact_workflow_contract
          tools.ci.test_shell_portability_contract

      - name: Analyze workspace
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: dart run melos run analyze

      - name: Check whitespace errors
        if: runner.environment == 'github-hosted' || needs.classify-changes.outputs.full_ci != 'true'
        run: git diff --check

  generated-consistency:
    name: Generated Consistency
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.full_ci == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted generated consistency
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-generated-consistency
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash tools/ci/verify_generated.sh

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Verify generated files
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: bash tools/ci/verify_generated.sh

      - name: Skip generated consistency
        if: needs.classify-changes.outputs.full_ci != 'true'
        run: |
          echo "Generated consistency skipped: ${{ needs.classify-changes.outputs.reason }}"

  tests:
    name: Tests
    needs: classify-changes
    if: ${{ needs.classify-changes.result == 'success' }}
    runs-on: ${{ ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') || (github.event_name == 'workflow_dispatch' && (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')))) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - name: Checkout repository
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load toolchain versions
        id: versions
        if: needs.classify-changes.outputs.full_ci == 'true'
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
          echo "java_distribution=$JAVA_DISTRIBUTION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}

      - name: Set up Flutter
        if: needs.classify-changes.outputs.full_ci == 'true'
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false

      - name: Run managed self-hosted Flutter tests
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'self-hosted'
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: ci-tests
          CI_ARTIFACT_ENVIRONMENT: repository
          CI_ARTIFACT_BUILD_MODE: verification
          CI_CLASSIFIER_REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command quality macos bash -lc '
            dart pub get && dart run melos exec -- flutter test
          '

      - name: Resolve dependencies
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: dart pub get

      - name: Run all Flutter tests
        if: needs.classify-changes.outputs.full_ci == 'true' && runner.environment == 'github-hosted'
        run: dart run melos exec -- flutter test

      - name: Skip Flutter tests
        if: needs.classify-changes.outputs.full_ci != 'true'
        run: |
          echo "Flutter tests skipped: ${{ needs.classify-changes.outputs.reason }}"

      - name: Preflight golden test failure evidence
        if: >-
          needs.classify-changes.outputs.full_ci == 'true' &&
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          contains(fromJSON('["failure-only","full"]'), inputs.artifact_transport)
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport "${{ inputs.artifact_transport }}"
          --path packages/design_system/test/failures/

      - name: GitHub storage warning for full golden evidence
        if: >-
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload golden test failure evidence
        if: >-
          needs.classify-changes.outputs.full_ci == 'true' &&
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          runner.environment == 'github-hosted' &&
          contains(fromJSON('["failure-only","full"]'), inputs.artifact_transport)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-test-failures-${{ github.sha }}
          path: packages/design_system/test/failures/
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact_transport == 'full' && 1 || 7 }}

  artifact-summary:
    name: Artifact Summary
    needs: [classify-changes, quality, generated-consistency, tests]
    if: >-
      always() &&
      needs.classify-changes.outputs.full_ci == 'true' &&
      ((github.event_name == 'push' && vars.CI_EXECUTION_MODE == 'self-hosted') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.execution_mode == 'self-hosted' ||
         (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted'))))
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate managed CI run
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tools/ci/run_local_ci.sh aggregate-managed-run
