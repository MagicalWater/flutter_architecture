name: Observability Acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      remote_acceptance:
        description: Run secret-backed staging acceptance and symbol uploads
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: PR-safe Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify observability acceptance contract
        run: python3 -m unittest tools.ci.test_observability_acceptance_workflow
      - name: Record upload disposition
        run: |
          echo "Upload skipped: PR-safe contract job never reads provider secrets."

  android-symbols:
    name: Android Symbols
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.remote_acceptance == true)
    environment: staging-observability
    runs-on: ubuntu-24.04
    env:
      REMOTE_ACCEPTANCE_READY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && secrets.FIREBASE_ANDROID_PRODUCTION_CONFIG_B64 != '' && secrets.FIREBASE_ANDROID_STAGING_CONFIG_B64 != '' && secrets.FIREBASE_ANDROID_APP_ID != '' && secrets.FIREBASE_ANDROID_STAGING_APP_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load toolchain versions
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          {
            echo "flutter_version=$FLUTTER_VERSION"
            echo "java_version=$JAVA_VERSION"
            echo "java_distribution=$JAVA_DISTRIBUTION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Explain missing Android secret boundary
        if: env.REMOTE_ACCEPTANCE_READY != 'true'
        run: |
          echo "Upload skipped: Android observability secrets are not configured."
      - name: Materialize Android provider config and credentials
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        shell: bash
        env:
          CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_CONFIG_B64 }}
          STAGING_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_STAGING_CONFIG_B64 }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p apps/flutter_architecture/android/app/src/production apps/flutter_architecture/android/app/src/staging "$RUNNER_TEMP/firebase"
          printf '%s' "$CONFIG_B64" | base64 --decode > apps/flutter_architecture/android/app/src/production/google-services.json
          printf '%s' "$STAGING_CONFIG_B64" | base64 --decode > apps/flutter_architecture/android/app/src/staging/google-services.json
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase/service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase/service-account.json"
      - name: Build Android production symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/android-production-artifact
        run: bash tools/ci/build_android_production.sh
      - name: Install Firebase CLI
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        run: npm install --global firebase-tools@15.24.0
      - name: Upload Android Flutter symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: bash tools/ci/upload_android_flutter_symbols.sh "$RUNNER_TEMP/android-production-artifact/flutter-symbols"
      - name: Build controlled Android staging acceptance release
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/android-staging-acceptance
          OBSERVABILITY_REMOTE_COLLECTION_ENABLED: 'true'
          OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED: 'true'
        run: >-
          bash tools/ci/build_android_environment.sh
          staging release lib/main_staging.dart real
      - name: Upload Android staging Flutter symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_STAGING_APP_ID }}
        run: bash tools/ci/upload_android_flutter_symbols.sh "$RUNNER_TEMP/android-staging-acceptance/flutter-symbols"
      - name: Write Android evidence
        env:
          STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && 'uploaded' || 'not-executed' }}
        run: |
          python3 tools/ci/write_observability_acceptance_evidence.py \
            --output "$RUNNER_TEMP/observability/android.txt" \
            --platform android \
            --commit-sha "$GITHUB_SHA" \
            --release "1.8.0+${GITHUB_RUN_NUMBER}" \
            --remote-event-status not-executed \
            --symbolication-status "$STATUS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observability/
            ${{ runner.temp }}/android-staging-acceptance/
          if-no-files-found: error
          retention-days: 30

  ios-symbols:
    name: iOS dSYMs
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || inputs.remote_acceptance == true)
    environment: staging-observability
    runs-on: macos-15
    env:
      REMOTE_ACCEPTANCE_READY: ${{ secrets.FIREBASE_IOS_PRODUCTION_CONFIG_B64 != '' && secrets.FIREBASE_IOS_STAGING_CONFIG_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load Flutter version
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Explain missing iOS secret boundary
        if: env.REMOTE_ACCEPTANCE_READY != 'true'
        run: |
          echo "Upload skipped: iOS observability secrets are not configured."
      - name: Materialize iOS provider config
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          CONFIG_B64: ${{ secrets.FIREBASE_IOS_PRODUCTION_CONFIG_B64 }}
          STAGING_CONFIG_B64: ${{ secrets.FIREBASE_IOS_STAGING_CONFIG_B64 }}
        run: |
          mkdir -p apps/flutter_architecture/ios/Firebase/production apps/flutter_architecture/ios/Firebase/staging
          printf '%s' "$CONFIG_B64" | base64 --decode > apps/flutter_architecture/ios/Firebase/production/GoogleService-Info.plist
          printf '%s' "$STAGING_CONFIG_B64" | base64 --decode > apps/flutter_architecture/ios/Firebase/staging/GoogleService-Info.plist
      - name: Build iOS production dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/ios-production-artifact
        run: bash tools/ci/build_ios_production.sh
      - name: Upload iOS dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        run: >-
          bash tools/ci/upload_ios_dsyms.sh production
          "$RUNNER_TEMP/ios-production-artifact/Flutter Architecture.app.dSYM"
      - name: Build controlled iOS staging acceptance app
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/ios-staging-acceptance
          OBSERVABILITY_REMOTE_COLLECTION_ENABLED: 'true'
          OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED: 'true'
          GENERATE_DSYM_FOR_ACCEPTANCE: 'true'
        run: >-
          bash tools/ci/build_ios_environment.sh
          staging Staging Debug-staging iphonesimulator lib/main_staging.dart real
      - name: Upload iOS staging dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        run: >-
          bash tools/ci/upload_ios_dsyms.sh staging
          "$RUNNER_TEMP/ios-staging-acceptance/dSYMs"
      - name: Write iOS evidence
        env:
          STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && 'uploaded' || 'not-executed' }}
        run: |
          python3 tools/ci/write_observability_acceptance_evidence.py \
            --output "$RUNNER_TEMP/observability/ios.txt" \
            --platform ios \
            --commit-sha "$GITHUB_SHA" \
            --release "1.8.0+${GITHUB_RUN_NUMBER}" \
            --remote-event-status not-executed \
            --symbolication-status "$STATUS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observability/
            ${{ runner.temp }}/ios-staging-acceptance/
          if-no-files-found: error
          retention-days: 30
