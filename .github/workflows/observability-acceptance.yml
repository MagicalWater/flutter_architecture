name: Observability Acceptance

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: CI execution mode for this run
        required: true
        default: repository-default
        type: choice
        options: [repository-default, manual-local, self-hosted, github-hosted]
      artifact_transport:
        description: GitHub artifact transport for this manual run
        required: true
        default: repository-default
        type: choice
        options: [repository-default, none, failure-only, full]
      remote_acceptance:
        description: Run secret-backed staging acceptance and symbol uploads
        required: false
        default: false
        type: boolean
      emit_controlled_event:
        description: Opt in to controlled staging event emission
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: observability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Secret-safe Contract
    if: >-
      ${{
        (inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
        contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode)
      }}
    runs-on: ${{ (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify observability acceptance contract
        run: python3 -m unittest tools.ci.test_secret_leakage
      - name: Record upload disposition
        run: |
          echo "Upload skipped: secret-safe contract job never reads provider secrets."

  android-symbols:
    name: Android Symbols
    if: >-
      inputs.remote_acceptance == true &&
      ((inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
       contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode))
    environment: staging-observability
    runs-on: ${{ (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'ubuntu-24.04' }}
    env:
      REMOTE_ACCEPTANCE_READY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' && secrets.FIREBASE_ANDROID_PRODUCTION_CONFIG_B64 != '' && secrets.FIREBASE_ANDROID_STAGING_CONFIG_B64 != '' && secrets.FIREBASE_ANDROID_APP_ID != '' && secrets.FIREBASE_ANDROID_STAGING_APP_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load toolchain versions
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          {
            echo "flutter_version=$FLUTTER_VERSION"
            echo "java_version=$JAVA_VERSION"
            echo "java_distribution=$JAVA_DISTRIBUTION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: ${{ steps.versions.outputs.java_distribution }}
          java-version: ${{ steps.versions.outputs.java_version }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false
      - name: Explain missing Android secret boundary
        if: env.REMOTE_ACCEPTANCE_READY != 'true'
        run: |
          echo "Upload skipped: Android observability secrets are not configured."
      - name: Materialize Android provider config and credentials
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        shell: bash
        env:
          CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_PRODUCTION_CONFIG_B64 }}
          STAGING_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_STAGING_CONFIG_B64 }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p apps/flutter_architecture/android/app/src/production apps/flutter_architecture/android/app/src/staging "$RUNNER_TEMP/firebase"
          printf '%s' "$CONFIG_B64" | base64 --decode > apps/flutter_architecture/android/app/src/production/google-services.json
          printf '%s' "$STAGING_CONFIG_B64" | base64 --decode > apps/flutter_architecture/android/app/src/staging/google-services.json
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase/service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase/service-account.json"
      - name: Build Android production symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/android-production-artifact
        run: bash tools/ci/build_android_production.sh
      - name: Install Firebase CLI
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        run: npm install --global firebase-tools@15.24.0
      - name: Upload Android Flutter symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: bash tools/ci/upload_android_flutter_symbols.sh "$RUNNER_TEMP/android-production-artifact/flutter-symbols"
      - name: Build controlled Android staging acceptance release
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/android-staging-acceptance
          OBSERVABILITY_REMOTE_COLLECTION_ENABLED: 'true'
          OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED: ${{ inputs.emit_controlled_event == true && 'true' || 'false' }}
        run: >-
          bash tools/ci/build_android_environment.sh
          staging release lib/main_staging.dart real
      - name: Upload Android staging Flutter symbols
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_STAGING_APP_ID }}
        run: bash tools/ci/upload_android_flutter_symbols.sh "$RUNNER_TEMP/android-staging-acceptance/flutter-symbols"
      - name: Write Android evidence
        if: runner.environment == 'github-hosted'
        env:
          STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && 'uploaded' || 'not-executed' }}
          EVENT_STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && inputs.emit_controlled_event == true && 'requested' || 'not-executed' }}
        run: |
          python3 tools/ci/write_observability_acceptance_evidence.py \
            --output "$RUNNER_TEMP/observability/android.txt" \
            --platform android \
            --commit-sha "$GITHUB_SHA" \
            --release "$(cat VERSION)+${GITHUB_RUN_NUMBER}" \
            --remote-event-status "$EVENT_STATUS" \
            --symbolication-status "$STATUS"

      - name: Build managed self-hosted Android observability evidence
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'self-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_STAGING_APP_ID: ${{ secrets.FIREBASE_ANDROID_STAGING_APP_ID }}
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: observability-android
          CI_RETENTION_CLASS: observability-raw
          CI_ARTIFACT_ENVIRONMENT: multiple
          CI_ARTIFACT_BUILD_MODE: release
          CI_ARTIFACT_KIND: observability-android
          EMIT_CONTROLLED_EVENT: ${{ inputs.emit_controlled_event == true && 'true' || 'false' }}
          CONTROLLED_EVENT_STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && inputs.emit_controlled_event == true && 'requested' || 'not-executed' }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command observability android bash -lc '
            managed_artifact_dir="$ARTIFACT_DIR" &&
            ARTIFACT_DIR="$managed_artifact_dir/android-production" \
              bash tools/ci/build_android_production.sh &&
            bash tools/ci/upload_android_flutter_symbols.sh \
              "$managed_artifact_dir/android-production/flutter-symbols" &&
            FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_STAGING_APP_ID" \
              ARTIFACT_DIR="$managed_artifact_dir/android-staging" \
              OBSERVABILITY_REMOTE_COLLECTION_ENABLED=true \
              OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED="$EMIT_CONTROLLED_EVENT" \
              bash tools/ci/build_android_environment.sh staging release lib/main_staging.dart real &&
            FIREBASE_ANDROID_APP_ID="$FIREBASE_ANDROID_STAGING_APP_ID" \
              bash tools/ci/upload_android_flutter_symbols.sh \
              "$managed_artifact_dir/android-staging/flutter-symbols" &&
            mkdir -p "$managed_artifact_dir/evidence" &&
            python3 tools/ci/write_observability_acceptance_evidence.py \
              --output "$managed_artifact_dir/evidence/android.txt" \
              --platform android \
              --commit-sha "$GITHUB_SHA" \
              --release "$(cat VERSION)+$GITHUB_RUN_NUMBER" \
              --remote-event-status "$CONTROLLED_EVENT_STATUS" \
              --symbolication-status uploaded
          '

      - name: Preflight Android observability full artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport full
          --path "$RUNNER_TEMP/observability"

      - name: GitHub storage warning for full Android observability artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload Android observability full artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-android-${{ github.sha }}
          path: ${{ runner.temp }}/observability/
          if-no-files-found: error
          retention-days: 1
      - name: Clean Android observability secrets
        if: always()
        shell: bash
        run: |
          bash tools/ci/cleanup_ci_secrets.sh "$GITHUB_WORKSPACE"
          bash tools/ci/cleanup_ci_secrets.sh "$RUNNER_TEMP"

  ios-symbols:
    name: iOS dSYMs
    if: >-
      inputs.remote_acceptance == true &&
      ((inputs.execution_mode == 'repository-default' && contains(fromJSON('["self-hosted","github-hosted"]'), vars.CI_EXECUTION_MODE)) ||
       contains(fromJSON('["self-hosted","github-hosted"]'), inputs.execution_mode))
    environment: staging-observability
    runs-on: ${{ (inputs.execution_mode == 'self-hosted' || (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted')) && fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') || 'macos-15' }}
    env:
      REMOTE_ACCEPTANCE_READY: ${{ secrets.FIREBASE_IOS_PRODUCTION_CONFIG_B64 != '' && secrets.FIREBASE_IOS_STAGING_CONFIG_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load Flutter version
        id: versions
        shell: bash
        run: |
          source .github/versions.env
          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.versions.outputs.flutter_version }}
          channel: stable
          cache: false
      - name: Explain missing iOS secret boundary
        if: env.REMOTE_ACCEPTANCE_READY != 'true'
        run: |
          echo "Upload skipped: iOS observability secrets are not configured."
      - name: Materialize iOS provider config
        if: env.REMOTE_ACCEPTANCE_READY == 'true'
        env:
          CONFIG_B64: ${{ secrets.FIREBASE_IOS_PRODUCTION_CONFIG_B64 }}
          STAGING_CONFIG_B64: ${{ secrets.FIREBASE_IOS_STAGING_CONFIG_B64 }}
        run: |
          mkdir -p apps/flutter_architecture/ios/Firebase/production apps/flutter_architecture/ios/Firebase/staging
          printf '%s' "$CONFIG_B64" | base64 --decode > apps/flutter_architecture/ios/Firebase/production/GoogleService-Info.plist
          printf '%s' "$STAGING_CONFIG_B64" | base64 --decode > apps/flutter_architecture/ios/Firebase/staging/GoogleService-Info.plist
      - name: Build iOS production dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/ios-production-artifact
        run: bash tools/ci/build_ios_production.sh
      - name: Upload iOS dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        run: >-
          bash tools/ci/upload_ios_dsyms.sh production
          "$(find "$RUNNER_TEMP/ios-production-artifact" -maxdepth 2 -type d -name '*.app.dSYM' -print -quit)"
      - name: Build controlled iOS staging acceptance app
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          ARTIFACT_DIR: ${{ runner.temp }}/ios-staging-acceptance
          OBSERVABILITY_REMOTE_COLLECTION_ENABLED: 'true'
          OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED: ${{ inputs.emit_controlled_event == true && 'true' || 'false' }}
          GENERATE_DSYM_FOR_ACCEPTANCE: 'true'
        run: >-
          bash tools/ci/build_ios_environment.sh
          staging Staging Debug-staging iphonesimulator lib/main_staging.dart real
      - name: Upload iOS staging dSYM
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'github-hosted'
        run: >-
          bash tools/ci/upload_ios_dsyms.sh staging
          "$RUNNER_TEMP/ios-staging-acceptance/dSYMs"
      - name: Write iOS evidence
        if: runner.environment == 'github-hosted'
        env:
          STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && 'uploaded' || 'not-executed' }}
          EVENT_STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && inputs.emit_controlled_event == true && 'requested' || 'not-executed' }}
        run: |
          python3 tools/ci/write_observability_acceptance_evidence.py \
            --output "$RUNNER_TEMP/observability/ios.txt" \
            --platform ios \
            --commit-sha "$GITHUB_SHA" \
            --release "$(cat VERSION)+${GITHUB_RUN_NUMBER}" \
            --remote-event-status "$EVENT_STATUS" \
            --symbolication-status "$STATUS"

      - name: Build managed self-hosted iOS observability evidence
        if: env.REMOTE_ACCEPTANCE_READY == 'true' && runner.environment == 'self-hosted'
        env:
          API_BASE_URL: https://api.acme.test
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_JOB_KEY: observability-ios
          CI_RETENTION_CLASS: observability-raw
          CI_ARTIFACT_ENVIRONMENT: multiple
          CI_ARTIFACT_BUILD_MODE: release
          CI_ARTIFACT_KIND: observability-ios
          EMIT_CONTROLLED_EVENT: ${{ inputs.emit_controlled_event == true && 'true' || 'false' }}
          CONTROLLED_EVENT_STATUS: ${{ env.REMOTE_ACCEPTANCE_READY == 'true' && inputs.emit_controlled_event == true && 'requested' || 'not-executed' }}
        run: |
          # Local-only evidence; not downloadable from GitHub. The wrapper writes $GITHUB_STEP_SUMMARY.
          bash tools/ci/run_local_ci.sh managed-command observability ios bash -lc '
            managed_artifact_dir="$ARTIFACT_DIR" &&
            ARTIFACT_DIR="$managed_artifact_dir/ios-production" \
              bash tools/ci/build_ios_production.sh &&
            bash tools/ci/upload_ios_dsyms.sh production \
              "$managed_artifact_dir/ios-production/dSYMs" &&
            ARTIFACT_DIR="$managed_artifact_dir/ios-staging" \
              OBSERVABILITY_REMOTE_COLLECTION_ENABLED=true \
              OBSERVABILITY_ACCEPTANCE_EVENT_ENABLED="$EMIT_CONTROLLED_EVENT" \
              GENERATE_DSYM_FOR_ACCEPTANCE=true \
              bash tools/ci/build_ios_environment.sh staging Staging Debug-staging iphonesimulator lib/main_staging.dart real &&
            bash tools/ci/upload_ios_dsyms.sh staging \
              "$managed_artifact_dir/ios-staging/dSYMs" &&
            mkdir -p "$managed_artifact_dir/evidence" &&
            python3 tools/ci/write_observability_acceptance_evidence.py \
              --output "$managed_artifact_dir/evidence/ios.txt" \
              --platform ios \
              --commit-sha "$GITHUB_SHA" \
              --release "$(cat VERSION)+$GITHUB_RUN_NUMBER" \
              --remote-event-status "$CONTROLLED_EVENT_STATUS" \
              --symbolication-status uploaded
          '

      - name: Preflight iOS observability full artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: >-
          python3 tools/ci/artifact_transport.py preflight
          --transport full
          --path "$RUNNER_TEMP/observability"

      - name: GitHub storage warning for full iOS observability artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        run: echo "GitHub storage warning - full transport is retained for one day."

      - name: Upload iOS observability full artifact
        if: >-
          runner.environment == 'github-hosted' &&
          inputs.artifact_transport == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-ios-${{ github.sha }}
          path: ${{ runner.temp }}/observability/
          if-no-files-found: error
          retention-days: 1
      - name: Clean iOS observability secrets
        if: always()
        shell: bash
        run: |
          bash tools/ci/cleanup_ci_secrets.sh "$GITHUB_WORKSPACE"
          bash tools/ci/cleanup_ci_secrets.sh "$RUNNER_TEMP"

  observability-summary:
    name: Observability Summary
    needs: [contract, android-symbols, ios-symbols]
    if: >-
      always() &&
      inputs.remote_acceptance == true &&
      (inputs.execution_mode == 'self-hosted' ||
       (inputs.execution_mode == 'repository-default' && vars.CI_EXECUTION_MODE == 'self-hosted'))
    runs-on: ${{ fromJSON('["self-hosted","macOS","ARM64","flutter-architecture","trusted-main"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate managed observability run
        shell: bash
        env:
          CI_ARTIFACT_ROOT: ${{ vars.CI_ARTIFACT_ROOT }}
          CI_MANAGED_EXECUTION_MODE: self-hosted
          CI_RUN_KEY: gh-${{ github.run_id }}-${{ github.run_attempt }}
          CI_ALLOW_EMPTY_AGGREGATION: 'true'
        run: bash tools/ci/run_local_ci.sh aggregate-managed-run
