name: flutter_enterprise_architecture_template_workspace
description: Flutter Enterprise Architecture Template 的 Melos workspace 設定。
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - apps/flutter_architecture
  - packages/api_client
  - packages/auth
  - packages/core
  - packages/design_system

dev_dependencies:
  melos: ^8.0.0

melos:
  scripts:
    analyze:
      description: 執行靜態分析。
      run: dart run melos exec -- flutter analyze

    build_runner:
      description: 執行 build_runner 產生 Freezed、Auto Route、Injectable 程式碼。
      run: dart run melos exec --depends-on=build_runner --order-dependents --concurrency=1 -- dart run build_runner build && dart run tools/codegen/normalize_generated.dart

    docs_check:
      description: 驗證文件連結、metadata、版本、ID、狀態與 README coverage。
      run: dart run tools/docs/run_check.dart .
